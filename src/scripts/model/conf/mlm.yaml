# rhm_config.yaml - Example configuration for RHM training
dataset_path: "./src/data/datasets/train/raw"
output_dir: "./src/models/rhm_clm_training"
# Dataset configuration
train_split_ratio: 0.8
filter_config_L: 3          # Filter by hierarchy depth (optional)
filter_config_m: 2          # Filter by multiplicity (optional)
max_samples: 10000          # Limit samples for testing (optional)

# Model configuration
task_name: "mlm"            # "clm" for causal LM, "mlm" for masked LM
vocab_size: 32              # Base vocabulary size
hidden_size: 512
num_hidden_layers: 6
num_attention_heads: 8
intermediate_size: 2048
max_position_embeddings: 2048

# Training configuration
num_train_epochs: 5
per_device_train_batch_size: 16
per_device_eval_batch_size: 32
gradient_accumulation_steps: 1
learning_rate: 5e-4
weight_decay: 0.01
warmup_ratio: 0.1

# Sequence packing
pack_sequences: true
max_sequence_length: 512
separator_token_id: 0

# MLM specific (only used when task_name: "mlm")
mlm_probability: 0.15
mask_strategy: "random"     # "random", "hierarchical", "level_specific"

# Evaluation and checkpointing
eval_steps: 1
save_steps: 1
logging_steps: 1
save_total_limit: 3
load_best_model_at_end: true

# Early stopping
early_stopping: true
early_stopping_patience: 3

# System configuration
seed: 42
fp16: false
bf16: false
dataloader_num_workers: 4

# Hierarchical analysis
track_hierarchical_metrics: true
hierarchical_eval_frequency: 1000

# Experiment tracking
run_name: "rhm_clm_test_run"
report_to: ["wandb"]