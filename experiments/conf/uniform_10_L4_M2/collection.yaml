# Collection configuration for uniform_10_L4_M2
# Only contains collection-specific parameters
# Model variants auto-discovered from existing clm.yaml, mlm.yaml files
# Place at: conf/uniform_10_L4_M2/collection.yaml
# Base configuration - minimal
base_config:
  # Evaluation types to process (auto-discovered from datasets/.../eval/)
  evaluation_types:
    - "memorization"
    - "id_generalization" 
    - "ood_same_rule"
    - "ood_transfer"

# Collection-specific parameters (not in model configs)
collection_config:
  # Memory management - control attention data collection
  capture_attention: false
  
  # Evaluation parameters
  evaluation_parameters:
    context_sizes: [1, 2, 3, 4, 5]
    control_types: 
      - "normal"
      - "shuffled_context" 
      - "random_context"
  
  # Execution parameters
  execution_parameters:
    device: cpu
    batch_size: 32
    max_sequences_per_condition: 10
    save_intermediate: true
    intermediate_save_frequency: 5
  
  # Memory management
  memory_management:
    clear_cache_frequency: 10
    max_memory_usage_gb: 12.0
  
  # Error handling
  error_handling:
    max_model_failures: 5
    retry_failed_models: true
    failure_retry_delay: 0_distance: 2         # Maximum increase in L or m
    num_transfer_seeds: 2            # Seeds per transfer configuration
    sequences_per_seed: 200          # Sequences per seed
    min_sequences_per_seed: 50       # Mini
    transfer_seed_offset: 200000     # Seed offset for transfer seeds
