# Sample collection.yaml configuration
# This file should be placed at: conf/{dataset_type}_{num_seeds}_L{L}_M{m}/collection.yaml

collection_config:
  # Evaluation parameters (original)
  evaluation_parameters:
    context_sizes: [1, 5, 10, 15, 20, 25, 30, 35, 40]
    control_types: ["normal", "shuffled_context", "random_context"]

  # Execution parameters (original + new memory management)
  execution_parameters:
    # Basic execution settings
    batch_size: 32
    max_sequences_per_condition: 200
    capture_attention: true
    
    # Memory management settings (NEW)
    sequence_chunk_size: 50          # Process sequences in chunks to save memory
    offload_models: false            # Move models to CPU between evaluations (useful for batch mode)
    
    # Attention capture settings (NEW)
    selective_attention: "all"       # Options: "all", "last", "first", "middle"
    attention_layers: null           # Specific layers: [0, 5, 11] or null for all
    attention_heads: null            # Specific heads: [0, 1, 7] or null for all  
    attention_sampling_rate: 0.1     # Fraction of sequences to capture attention (0.0-1.0)

