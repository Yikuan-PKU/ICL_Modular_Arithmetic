# config/uniform_10_L4_M2/training.yaml
# Unified training configuration for both CLM and MLM
# L and M values now come from command line arguments

# Model architecture (shared)
vocab_size: 37
hidden_size: 512
num_hidden_layers: 6
num_attention_heads: 8
intermediate_size: 2048
max_position_embeddings: 2048

# Training parameters (shared)
num_train_epochs: 20
per_device_train_batch_size: 32
per_device_eval_batch_size: 64
gradient_accumulation_steps: 1
learning_rate: 1e-3
weight_decay: 0.01
warmup_ratio: 0.1
lr_scheduler_type: "linear"

# Sequence processing (shared)
max_sequence_length: 512
pack_sequences: true  # Always true, not configurable

# Cross-configuration shuffling (shared)
shuffle_before_packing: false
shuffle_strategy: "global"  # "global", "balanced"
shuffle_seed: 42

# Seed-aware batching (shared)
seed_balanced_batching: true
seed_sampling_strategy: "balanced"  # "balanced", "random", "weighted"
seeds_per_batch: null  # null = use all available seeds

# NEW: Last-token prediction (shared)
last_token_prediction: false  # Enable last-token prediction masking

# UPDATED: Checkpointing and evaluation with steps option
save_by_steps: false  # If true, save by steps instead of epochs
save_steps_interval: 500  # Steps interval when save_by_steps=true
save_strategy: "epoch"  # Will be overridden based on save_by_steps
save_steps: 1  # Will be overridden based on save_by_steps
save_total_limit: 100
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
evaluation_strategy: "epoch"
eval_steps: 1  # Evaluate every epoch

# Logging (shared)
logging_strategy: "steps"
logging_steps: 50

# Optimization (shared)
adam_beta1: 0.9
adam_beta2: 0.999
max_grad_norm: 1.0

# Dataset configuration (shared)
train_split_ratio: 0.8
max_samples_per_seed: null  # null = use all samples

# Hierarchical metrics (shared)
track_hierarchical_metrics: true

# Reproducibility (shared)
seed: 42

# Logging and monitoring (shared)
report_to: ["tensorboard"]
run_name: null  # Will be auto-generated

# Mixed precision (shared)
fp16: false
bf16: false

# Task-specific configurations
# The task_name will be set by --model-type argument (clm or mlm)
task_specific:
  clm:
    task_name: "clm"
    mlm: false  # CLM doesn't use masking
    last_token_prediction: true  # Often useful for CLM
    
  mlm:
    task_name: "mlm"
    mlm: true   # MLM uses masking
    mlm_probability: 0.15  # Standard MLM masking probability
    last_token_prediction: false  # Usually not needed for MLM