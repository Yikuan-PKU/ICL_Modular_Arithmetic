# Configuration for L=4, m=2 with uniform distribution
# Compatible with existing RHM generation pipeline

rhm_params:
  vocab_size: 32
  num_classes: 2
  tuple_size: 2
  samples_per_config: 4000  # Number of samples per seed for this (L,M) configuration

# Distribution type for rule sampling
distribution:
  type: "uniform"     # Options: "uniform", "zipf"
  zipf_alpha: 1.0     # Only used if type is "zipf"

# Global deduplication configuration
deduplication:
  enabled: true  # Set to false to use original generation method
  max_attempts: 15  # Maximum attempts to generate unique sequences per seed
  batch_multiplier: 2.5  # Multiplier for initial batch size (higher = fewer attempts needed)

# Configuration-specific metadata
metadata:
  description: "L=4, m=2 configuration for ICL experiments"
  experiment_notes: "Deep hierarchy (L=4) with low multiplicity (m=2)"
  complexity: "high"

# Validation parameters (optional)
validation:
  min_sequence_length: 16   # Expected: tuple_size^L = 2^4 = 16
  max_sequence_length: 16   # Should be exactly 16 for this configuration
  vocab_check: true