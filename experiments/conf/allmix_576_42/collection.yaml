# ICL Evaluation Collection Configuration
# This file should be placed in: experiments/conf/{experiment_name}/collection.yaml
# Where {experiment_name} = {mixture_type}_{total_rules}_{seed}

# Base configuration for model selection and targeting
base_config:
  # Target model configurations to evaluate (L, m pairs)
  # L = depth, m = multiplicity/synonyms
  target_configs:
    - [2, 2]  # Basic configuration
    - [2, 3]  # Increased synonyms
    - [2, 4]
    - [3, 2]  # Increased depth
    - [3, 3]  # Balanced increase
    - [3, 4]
    - [4, 2]  # High depth
    - [4, 3]
    - [4, 4]  # High complexity

  # Training diversity levels to include
  # These correspond to the number of training examples (n_train)
  diversity_levels: [72] #TODO: remove this filter

  # Model types to evaluate
  model_types: ["causal_lm", "mlm"]

# Collection-specific configuration
collection_config:
  # Evaluation parameters
  evaluation_parameters:
    # Context sizes for ICL evaluation
    # Number of examples provided in context before query
    context_sizes: [1, 2, 3, 4, 5, 6, 8]
    
    # Transfer conditions to test
    transfer_conditions:
      - "within_config"   # Same config as training
      - "cross_L"         # Different depth (L)
      - "cross_m"         # Different multiplicity (m)
      - "cross_config"    # Different both L and m
    
    # Control types for baseline comparison
    control_types:
      - "normal"            # Standard ICL
      - "shuffled_context"  # Shuffled context order
      - "random_context"    # Random context examples

  # Execution parameters
  execution_parameters:
    # Batch processing settings
    batch_size: 32
    max_sequences_per_condition: 200
    
    # Data collection options
    capture_attention: true      # Capture attention patterns
    save_intermediate: true      # Save partial results
    intermediate_save_frequency: 5  # Save every N models

  # Memory management settings
  memory_management:
    # Memory optimization settings
    clear_cache_frequency: 10     # Clear GPU cache every N models
    max_memory_usage_gb: 12.0     # Maximum GPU memory usage

  # Error handling settings
  error_handling:
    # Error recovery settings
    max_model_failures: 5         # Max consecutive failures before stopping
    retry_failed_models: true     # Retry failed model evaluations
    failure_retry_delay: 60       # Seconds between retries

# Optional: Advanced configuration for fine-tuning
advanced_config:
  # Checkpoint discovery settings
  checkpoint_discovery:
    # Patterns to look for when discovering checkpoints
    checkpoint_patterns:
      - "checkpoint-*"
      - "step_*"
      - "step-*"
    
    # Required files for valid checkpoint
    required_files:
      - "config.json"
    
    # Model weight file patterns
    model_file_patterns:
      - "pytorch_model.bin"
      - "model.safetensors"
      - "model.pt"

  # Evaluation dataset format preferences
  dataset_preferences:
    # Preferred evaluation dataset format
    preferred_format: "huggingface"  # "huggingface" or "json"
    
    # Fallback format if preferred not available
    fallback_format: "json"

  # Output customization
  output_config:
    # Custom output directory suffix (optional)
    output_suffix: ""  # Will be appended to auto-generated output dir
    
    # Additional metadata to include
    include_model_checksums: false
    include_dataset_fingerprint: true
