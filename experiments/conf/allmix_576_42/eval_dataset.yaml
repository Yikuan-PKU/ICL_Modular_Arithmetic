evaluation_params:
  base_seed: 42                    # Base seed for evaluation generation
  num_rules_per_config: 32         # Number of rule sets per configuration  
  sequences_per_rule: 200          # Number of sequences per rule set
  include_controls: true           # Generate control sequences for validation
  save_intermediate: true          # Save intermediate results during generation

transfer_config:
  max_depth: 5                     # Maximum hierarchy depth L for transfer testing
  max_multiplicity: 6              # Maximum multiplicity m for transfer testing
  depth_steps: [1, 2]              # Steps for depth transfer: L+1, L+2
  synonym_steps: [1, 2]            # Steps for synonym transfer: m+1, m+2  
  full_transfer_limit: 10          # Maximum number of full transfer configurations

icl_params:
  context_sizes: [1, 2, 3, 4, 5]   # Number of in-context examples to test
  control_types:                   # Types of control sequences to generate
    - "normal"                     # Standard ICL sequences
    - "shuffled_context"           # Context examples in random order
    - "random_context"             # Context from unrelated examples

hierarchical_annotations:
  enable_step_labels: true         # Include next-token labels at each position
  enable_hierarchy_path: true      # Include rule indices at each hierarchy level
  enable_critical_positions: true # Mark positions where key decisions occur
  enable_rule_metadata: true      # Include rule reference information

verification:
  enable_independence_checks: true    # Verify independence from training data
  enable_baseline_failure_tests: true # Test that simple baselines fail
  max_generation_attempts: 10        # Maximum attempts per model generation

# RHM parameters - should match the corresponding training dataset
rhm_params:
  vocab_size: 32                   # Vocabulary size (number of features)
  num_classes: 10                  # Number of output classes
  tuple_size: 2                    # Size of low-level representations

# Optional: Specify which transfer conditions to prioritize
condition_priorities:
  within_config: 1.0               # Same (L,m) as training - highest priority
  depth_transfer: 0.8              # Increase L only - high priority
  synonym_transfer: 0.6            # Increase m only - medium priority
  full_transfer: 0.4               # Increase both L and m - lower priority

# Optional: Advanced configuration for specific evaluation needs
advanced_config:
  min_sequences_per_condition: 100  # Minimum sequences per transfer condition
  balance_control_types: true       # Ensure equal representation of control types
  stratify_by_difficulty: false     # Group sequences by estimated difficulty
