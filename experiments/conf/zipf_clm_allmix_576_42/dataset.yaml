# config/zipf_clm_allmix_576_42/dataset.yaml
# Dataset generation configuration with Zipf distribution - CORRECTED SYNTAX

# RHM model parameters
rhm_params:
  vocab_size: 32
  num_classes: 10
  tuple_size: 2
  samples_per_config: 1000

# List of (L,m) configurations to generate - CORRECTED: No comma syntax
# L = hierarchy depth, m = multiplicity (number of synonyms)
configurations:
  - L: 2
    m: 2
  - L: 3
    m: 2
  - L: 2
    m: 4
  - L: 4
    m: 2
  - L: 3
    m: 3

# Zipf distribution settings for rule sampling
distribution:
  type: "zipf"
  zipf_alpha: 1.0

# Additional metadata
metadata:
  description: "Mixed complexity dataset with Zipf-distributed rule sampling"
  experiment_notes: "Testing effect of non-uniform rule probabilities on ICL"
  zipf_interpretation: "First synonymic rule at each level has highest probability"
  
# Validation settings
validation:
  min_sequence_length: 4
  max_sequence_length: 100
  vocab_check: true
  distribution_check: true